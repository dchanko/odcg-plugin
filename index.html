<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ODCG Calculator — Dev Sandbox</title>
    <style>
      body {
        font-family: Georgia, 'Times New Roman', serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.6;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.75rem;
      }
      .dev-note {
        padding: 0.75rem 1rem;
        border-left: 3px solid #2271b1;
        background: #f0f6fc;
        margin-bottom: 2rem;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Calculator Dev Sandbox</h1>
    <p class="dev-note">
      This page mimics a WordPress host page. The widget below is loaded via the
      same script-tag embed used in production.
    </p>

    <div id="odcg-calculator"></div>
    <script
      type="module"
      src="/src/embed.js"
      data-target="#odcg-calculator"
      data-formula="default"
    ></script>
  </body>
</html>
